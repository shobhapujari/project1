<!DOCTYPE html>
<html>
<head>
<title>Contact Form</title>
<style>
body{
  font-family: Arial;
  background: #f2f2f2;f2f2;
}
form{
  width:300px;
  margin:50px auto;
  padding:20px;
  background:white;
  border-radius:10px;
}
input, textarea{
  width:100%;
  margin:10px 0;
  padding:8px;
}
button{
  background:blue;
  color:white;
  padding:10px;
  border:none;
  width:100%;
}
</style>
</head>
<body>

<form>
<h2>Contact Us</h2>
<input type="text" placeholder="Enter Name">
<input type="email" placeholder="Enter Email">
<textarea placeholder="Your Message"></textarea>
<button>Submit</button>
</form>

</body>
</html>
